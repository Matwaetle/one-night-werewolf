# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 아래 설정대로 자동 배포됩니다.
#
# 구성 (DESIGN_SPEC §9.0)
#   1) one-night-werewolf        : 웹 서비스. 소켓과 /healthz 만 담당 (잠들 수 있음)
#   2) one-night-werewolf-static : 정적 사이트(CDN, 잠들지 않음). `node tools/stamp.js` 가 dist/ 를 만든다
#
# 오너가 직접 할 일 (1회)
#   - 정적 사이트가 만들어지면 그 주소를 웹 서비스의 환경변수 STATIC_ORIGIN 에 넣는다 (CORS)
#   - 정적 사이트의 SOCKET_URL 은 웹 서비스 주소(아래 값이 맞는지 확인)
services:
  - type: web
    name: one-night-werewolf
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 정적 사이트 주소, 예: https://one-night-werewolf-static.onrender.com (끝에 / 없이)
      - key: STATIC_ORIGIN
        sync: false

  - type: web
    name: one-night-werewolf-static
    runtime: static
    buildCommand: node tools/stamp.js
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SOCKET_URL
        value: https://one-night-werewolf-pa5a.onrender.com
    headers:
      - path: /a/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
