# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 아래 설정대로 자동 배포됩니다.
services:
  - type: web
    name: one-night-werewolf
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
